# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Các giá trị giả định phải có nguồn hoặc ghi rõ "tự ước tính"; simulate cảnh báo nếu còn giá trị mẫu.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng giả định — 3 kịch bản; chưa có tỷ lệ sử dụng AI thực đo
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 50
  base: 107
  high: 147
  source: "50 người: tự ước tính; 107 người: từng có ít nhất một lab không hoàn thành; 147 người: từng mở lab (evidence/data-mining.md). Đây là kịch bản giả định về số người dùng AI, chưa phải người dùng thực đo."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5              # tỉ lệ người dùng kiểu này
    uses_per_month: 1       # số phiên AI / người / tháng (giả định, không phải lượt mở lab)
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "Tỷ trọng 50% và 1 lượt hỏi/phiên: tự ước tính; P4 ghi nhận 1 lần gặp khó khăn/tháng, không đồng nghĩa 1 lần hỏi AI (evidence/interviews/P4.md)."
  - name: dung_vua
    share: 0.3
    uses_per_month: 2
    turns_per_session: 2
    source: "Tỷ trọng 30%, 2 phiên/tháng, 2 lượt hỏi/phiên: tự ước tính; chưa có quan sát trực tiếp về sử dụng AI."
  - name: dung_nhieu
    share: 0.2
    uses_per_month: 4
    turns_per_session: 3
    source: "Tỷ trọng 20%, 4 phiên/tháng, 3 lượt hỏi/phiên: tự ước tính để kiểm tra kịch bản sử dụng cao; chưa có quan sát trực tiếp về sử dụng AI."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "Google Gemini API Standard Paid Tier; https://ai.google.dev/gemini-api/docs/pricing ; tra cứu 28/11/2026"
  - model: gemini-2.5-pro
    input: 1.25
    output: 10.00
    source: "Google Gemini API Standard Paid Tier (prompt tối đa 200.000 token); https://ai.google.dev/gemini-api/docs/pricing ; tra cứu 28/11/2026. Áp giá để so sánh, không phải token đo trực tiếp trên model này."

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
